server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/geo+json image/svg+xml;

    # Assets con hash de Vite: cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # nginx no conoce la extensión .geojson: sin esto se sirve como binario y sin gzip
    # Límites de Jalisco y municipios: casi no cambian, se guardan un día (igual que las
    # teselas de colonias). Si se actualiza un archivo, tarda hasta un día en llegar a todos
    location ~* \.geojson$ {
        default_type application/geo+json;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
